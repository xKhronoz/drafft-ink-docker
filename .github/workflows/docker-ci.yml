name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate compose and image builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate nginx compose config
        run: docker compose -f docker-compose.yml -f docker-compose.nginx.yml config >/dev/null

      - name: Validate traefik compose config
        run: docker compose -f docker-compose.yml -f docker-compose.traefik.yml config >/dev/null

      - name: Validate bundled compose config
        run: docker compose -f docker-compose.bundle.yml config >/dev/null

      - name: Build server and web images
        run: docker compose build drafftink-server drafftink-web

      - name: Build bundled image
        run: docker compose -f docker-compose.bundle.yml build drafftink
