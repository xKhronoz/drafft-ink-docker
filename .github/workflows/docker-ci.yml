name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-compose:
    name: Validate compose configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate nginx compose config
        run: docker compose -f docker-compose.yml -f docker-compose.nginx.yml config >/dev/null

      - name: Validate traefik compose config
        run: docker compose -f docker-compose.yml -f docker-compose.traefik.yml config >/dev/null

      - name: Validate bundled compose config
        run: docker compose -f docker-compose.bundle.yml config >/dev/null

  build-images:
    name: Build images and export cache
    runs-on: ubuntu-latest
    needs: validate-compose

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build images and export cache with Bake
        uses: docker/bake-action@v7
        with:
          source: .
          files: ./docker-bake.hcl
          push: false
