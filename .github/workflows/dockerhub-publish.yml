name: Publish Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing repository tag to publish, for example v0.1.1
        required: true
        type: string

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      cargo_version: ${{ steps.release.outputs.cargo_version }}
      upstream_sha: ${{ steps.upstream.outputs.upstream_sha }}
      source_repository: ${{ steps.meta.outputs.source_repository }}
      upstream_repository: ${{ steps.meta.outputs.upstream_repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -eu

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${RELEASE_TAG_INPUT}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if ! printf '%s\n' "${release_tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tags must follow vX.Y.Z."
            exit 1
          fi

          if ! git rev-parse --verify "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${release_tag} does not exist in this repository."
            exit 1
          fi

          printf 'release_tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"
          printf 'cargo_version=%s\n' "${release_tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Clone upstream and validate Cargo version
        id: upstream
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.cargo_version }}
        run: |
          set -eu

          git clone --depth 1 --branch main https://github.com/PatWie/drafft-ink.git upstream
          cd upstream

          upstream_sha="$(git rev-parse HEAD)"
          cargo_version="$(
            python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])'
          )"

          if [ "${cargo_version}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Release tag version ${EXPECTED_VERSION} does not match upstream workspace.package.version ${cargo_version}."
            exit 1
          fi

          printf 'upstream_sha=%s\n' "${upstream_sha}" >> "${GITHUB_OUTPUT}"

      - name: Export source metadata
        id: meta
        run: |
          printf 'source_repository=%s\n' "https://github.com/${{ github.repository }}" >> "${GITHUB_OUTPUT}"
          printf 'upstream_repository=%s\n' "https://github.com/PatWie/drafft-ink" >> "${GITHUB_OUTPUT}"

  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images with Bake
        uses: docker/bake-action@v7
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          DRAFFTINK_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          IMAGE_VERSION: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_REPOSITORY: ${{ needs.prepare.outputs.source_repository }}
          UPSTREAM_REPOSITORY: ${{ needs.prepare.outputs.upstream_repository }}
        with:
          source: .
          files: ./docker-bake.hcl
          push: true

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - publish
    permissions:
      contents: write

    steps:
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_tag }}
          body: |
            Published Docker images for Drafft.ink `${{ needs.prepare.outputs.cargo_version }}`.

            Upstream source:
            - Repository: `${{ needs.prepare.outputs.upstream_repository }}`
            - Commit: `${{ needs.prepare.outputs.upstream_sha }}`

            Published images:
            - `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/drafft-ink-docker:server`
            - `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/drafft-ink-docker:server-latest`
            - `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/drafft-ink-docker:server-${{ needs.prepare.outputs.release_tag }}`
            - `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/drafft-ink-docker:web`
            - `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/drafft-ink-docker:web-latest`
            - `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/drafft-ink-docker:web-${{ needs.prepare.outputs.release_tag }}`
            - `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/drafft-ink-docker:latest`
            - `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/drafft-ink-docker:${{ needs.prepare.outputs.release_tag }}`
