name: Publish DockerHub Images

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    publish:
        name: Build and push images
        runs-on: ubuntu-latest
        permissions:
            contents: read

        strategy:
            fail-fast: false
            matrix:
                include:
                    - service: server
                      target: server
                      image_tag: server
                    - service: web
                      target: web
                      image_tag: web

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name || github.ref }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push ${{ matrix.service }} image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  target: ${{ matrix.target }}
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: |
                      docker.io/${{ secrets.DOCKERHUB_USERNAME }}/drafft-ink-docker:${{ matrix.image_tag }}
                      docker.io/${{ secrets.DOCKERHUB_USERNAME }}/drafft-ink-docker:${{ matrix.image_tag }}-latest
                      docker.io/${{ secrets.DOCKERHUB_USERNAME }}/drafft-ink-docker:${{ matrix.image_tag }}-${{ github.event.release.tag_name || github.ref_name }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
