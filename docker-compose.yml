services:
  drafftink-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: drafftink-server:local
    container_name: drafftink-server
    expose:
      - "3030"
    environment:
      RUST_LOG: drafftink_server=info,tower_http=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3030/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.http.routers.drafftink-ws.rule=PathPrefix(`/ws`)
      - traefik.http.routers.drafftink-ws.entrypoints=web
      - traefik.http.routers.drafftink-ws.priority=100
      - traefik.http.services.drafftink-server.loadbalancer.server.port=3030

  drafftink-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: drafftink-web:local
    container_name: drafftink-web
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.http.routers.drafftink-web.rule=PathPrefix(`/`)
      - traefik.http.routers.drafftink-web.entrypoints=web
      - traefik.http.routers.drafftink-web.priority=1
      - traefik.http.services.drafftink-web.loadbalancer.server.port=8080
